server:
  # 安全要求：只监听本机回环地址
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: whataday
  datasource:
    # 第一版使用 SQLite + JdbcTemplate。
    # 通过 URL 参数应用连接级 PRAGMA（xerial sqlite-jdbc 支持）：
    #   journal_mode=WAL   读写并发，写入不阻塞读取
    #   busy_timeout=5000  写锁等待 5s，避免瞬时 SQLITE_BUSY
    #   foreign_keys=on    SQLite 默认关闭外键约束，需显式开启
    url: "jdbc:sqlite:./data/whataday.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on"
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 单写入者，连接池限制为 1 以避免写锁竞争
      maximum-pool-size: 1
  sql:
    init:
      # SQLite 不被 Spring Boot 识别为 embedded 数据源，默认不会执行 schema.sql，
      # 因此必须显式设为 always；schema.sql 全部为 IF NOT EXISTS，幂等安全。
      mode: always
      schema-locations: classpath:schema.sql

# WhatADay 业务配置
whataday:
  collector:
    # mock：无需 Windows 环境 / 模型 Key 即可开发与演示
    # windows：真实读取前台窗口并截图
    mode: mock
    # 隐私：敏感应用不截图、不调用模型
    excluded-processes:
      - WeChat.exe
      - Alipay.exe
      - 1Password.exe
      - KeePass.exe

# OpenAPI / Swagger UI： http://127.0.0.1:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.example.whataday: DEBUG
