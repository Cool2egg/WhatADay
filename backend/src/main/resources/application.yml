server:
  # 安全要求：只监听本机回环地址
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: whataday
  datasource:
    # 第一版使用 SQLite + JdbcTemplate。
    # 通过 URL 参数应用连接级 PRAGMA（xerial sqlite-jdbc 支持）：
    #   journal_mode=WAL   读写并发，写入不阻塞读取
    #   busy_timeout=5000  写锁等待 5s，避免瞬时 SQLITE_BUSY
    #   foreign_keys=on    SQLite 默认关闭外键约束，需显式开启
    url: "jdbc:sqlite:./data/whataday.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on"
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 单写入者，连接池限制为 1 以避免写锁竞争
      maximum-pool-size: 1
  sql:
    init:
      # SQLite 不被 Spring Boot 识别为 embedded 数据源，默认不会执行 schema.sql，
      # 因此必须显式设为 always；schema.sql 全部为 IF NOT EXISTS，幂等安全。
      mode: always
      schema-locations: classpath:schema.sql

# WhatADay 业务配置
whataday:
  collector:
    # mock：无需 Windows 环境 / 模型 Key 即可开发与演示
    # desktop：真实读取前台窗口并按需截图（需要 Windows 用户桌面会话）
    mode: mock
    # 隐私：敏感应用不截图、不调用模型
    excluded-processes:
      - WeChat.exe
      - Alipay.exe
      - 1Password.exe
      - KeePass.exe
    # 以下均为 desktop 模式的采集参数，对应 PROJECT_PLAN 第 5.1 节
    window-poll-seconds: 30          # 读取前台窗口的间隔
    screenshot-min-interval-seconds: 120   # 两次截图之间的最小间隔
    max-merge-minutes: 30            # 单个活动最多合并到多少分钟
    merge-gap-minutes: 5             # 相邻事件间隔超过这个值就不合并
    screenshot-max-width: 1280       # 截图缩放后的最大宽度

  # 视觉模型：把「窗口信息 + 截图」理解成结构化活动事件
  # API Key 只从环境变量读取，绝不写进配置文件，避免密钥随代码入库。
  # 未设置 Key 时不创建模型，分析会自动退回窗口降级，应用照常运行。
  vision:
    api-key: ${WHATADAY_VISION_API_KEY:}
    base-url: ${WHATADAY_VISION_BASE_URL:https://api.openai.com/v1}
    model-name: ${WHATADAY_VISION_MODEL:gpt-4o-mini}
    timeout-seconds: 30
    max-tokens: 500
    temperature: 0.0
    # 部分 OpenAI 兼容端点不支持 response_format 参数，遇到调用报错可设为 false
    use-json-response-format: true
    # 打开会打印包含截图内容的请求体，仅排障时临时使用
    log-requests: false
    log-responses: false

  # 日报定时任务：默认每天 22:00 生成当天日报（PROJECT_PLAN 第 5.3 节）
  # 演示时可以改成 "0 * * * * *"（每分钟）立刻看到效果
  report:
    cron: "0 0 22 * * *"

# OpenAPI / Swagger UI： http://127.0.0.1:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    # 默认 INFO：DEBUG 会打印采集与分析的细节日志。
    # 注意本项目从不打印窗口标题、截图内容或手动记录正文，排障时可临时调到 DEBUG。
    com.example.whataday: INFO
